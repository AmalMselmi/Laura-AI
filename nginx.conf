# Edge reverse proxy: static UI (frontend service) + API (api service).
# Browser may call the API directly on :8000 (VITE_API_URL) or via /api here.

upstream laura_api {
    server api:8000;
}

upstream laura_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://laura_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://laura_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://laura_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
