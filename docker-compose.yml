# Project name in Docker Desktop / `docker compose ls` (Compose spec v2+)
name: laura-ai

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laura}
      POSTGRES_DB: ${POSTGRES_DB:-laura_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Host port default 5433 so Prisma/psql on the Mac can reach DB while another Postgres uses 5432.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://laura:laura@db:5432/laura_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-laura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laura}
      POSTGRES_DB: ${POSTGRES_DB:-laura_ai}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ENABLE_PACS_INTEGRATION: ${ENABLE_PACS_INTEGRATION:-true}
      ENABLE_AI_SCAN: ${ENABLE_AI_SCAN:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      DICOM_STORAGE_PATH: /app/data/dicom_uploads
      LOCAL_UPLOADS_PATH: /app/uploads
    volumes:
      - dicom_data:/app/data/dicom_uploads
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://laura:laura@db:5432/laura_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-laura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laura}
      POSTGRES_DB: ${POSTGRES_DB:-laura_ai}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      DICOM_STORAGE_PATH: /app/data/dicom_uploads
      LOCAL_UPLOADS_PATH: /app/uploads
    volumes:
      - dicom_data:/app/data/dicom_uploads
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  dicom_data:
  uploads_data:
